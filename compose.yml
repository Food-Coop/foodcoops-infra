name: ${COMPOSE_PROJECT_NAME:-foodcoops}

services:

  # ===========================================================================
  # nginx configuration
  # ===========================================================================

  nginx-config-init:
    image: nginx:alpine
    restart: "no"



    entrypoint:
      - /bin/sh


    volumes:
      - ./nginx/default.conf.template:/templates/default.conf.template:ro
      - nginx_cfg:/etc/nginx/conf.d

    networks:
      - foodcoops


  # ===========================================================================
  # Initial Let's Encrypt certificate
  # ===========================================================================
  #
  # Runs once before nginx starts.
  #
  # If a certificate already exists, this service exits immediately.
  #
  # network_mode: host is used so Certbot can temporarily listen directly
  # on host port 80 during the very first certificate request.
  #
  # ===========================================================================

  certbot-init:
    image: certbot/certbot:latest
    restart: "no"

    network_mode: host

    environment:
      DOMAIN: ${DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      CERTBOT_CERT_NAME: ${CERTBOT_CERT_NAME}

    entrypoint:
      - /bin/sh

    command:
      - -c
      - |
        if [ -f "/etc/letsencrypt/live/$$CERTBOT_CERT_NAME/fullchain.pem" ]; then
          echo "Let's Encrypt certificate already exists."
          exit 0
        fi

        echo "Requesting Let's Encrypt certificate..."

        certbot certonly \
          --standalone \
          --preferred-challenges http \
          --non-interactive \
          --agree-tos \
          --no-eff-email \
          --email "$$LETSENCRYPT_EMAIL" \
          --cert-name "$$CERTBOT_CERT_NAME" \
          -d "$$ROOT_DOMAIN" \
          -d "$$DOMAIN"

    volumes:
      - certbot_conf:/etc/letsencrypt


  # ===========================================================================
  # Frontend / nginx / Reverse Proxy
  # ===========================================================================

  frontend:
    build:
      context: ../foodcoops-frontend
      dockerfile: Dockerfile

      args:
        REACT_APP_NAME: ${REACT_APP_NAME}
        REACT_APP_VERSION: ${REACT_APP_VERSION}

        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
        REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}

        REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM}
        REACT_APP_KEYCLOAK_CLIENT_ID: ${REACT_APP_KEYCLOAK_CLIENT_ID}

    restart: unless-stopped

    depends_on:
      nginx-config-init:
        condition: service_completed_successfully

      certbot-init:
        condition: service_completed_successfully

    volumes:
      - nginx_cfg:/etc/nginx/conf.d

      # Let's Encrypt certificates
      - certbot_conf:/etc/letsencrypt:ro

      # ACME challenge files for later certificate renewals
      - certbot_www:/var/www/certbot:ro

    ports:
      - "80:80"
      - "443:443"

    # Watch the certificate file.
    #
    # If Certbot renews it, nginx automatically reloads the new certificate.
    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        CERT="/etc/letsencrypt/live/${CERTBOT_CERT_NAME}/fullchain.pem"

        LAST_HASH="$$(sha256sum "$$CERT" | awk '{print $$1}')"

        (
          while sleep 300; do

            NEW_HASH="$$(sha256sum "$$CERT" 2>/dev/null | awk '{print $$1}' || true)"

            if [ -n "$$NEW_HASH" ] && [ "$$NEW_HASH" != "$$LAST_HASH" ]; then

              echo "TLS certificate changed - reloading nginx..."

              if nginx -t; then
                nginx -s reload
                LAST_HASH="$$NEW_HASH"
              fi

            fi

          done
        ) &

        exec nginx -g 'daemon off;'

    networks:
      - foodcoops


  # ===========================================================================
  # Automatic Let's Encrypt renewal
  # ===========================================================================
  #
  # Checks twice per day.
  #
  # nginx serves:
  #
  # /.well-known/acme-challenge/
  #
  # from the shared certbot_www volume.
  #
  # ===========================================================================

  certbot-renew:
    image: certbot/certbot:latest

    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_started

    environment:
      DOMAIN: ${DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      CERTBOT_CERT_NAME: ${CERTBOT_CERT_NAME}

    entrypoint:
      - /bin/sh

    command:
      - -c
      - |
        while true; do

          sleep 12h

          echo "Checking Let's Encrypt certificate..."

          certbot certonly \
            --webroot \
            --webroot-path /var/www/certbot \
            --non-interactive \
            --agree-tos \
            --no-eff-email \
            --email "$$LETSENCRYPT_EMAIL" \
            --cert-name "$$CERTBOT_CERT_NAME" \
            --keep-until-expiring \
            -d "$$ROOT_DOMAIN" \
            -d "$$DOMAIN" \
            || true

        done

    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

    networks:
      - foodcoops


  # ===========================================================================
  # Backend
  # ===========================================================================

  backend:
    build:
      context: ../foodcoops-backend
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "${BACKEND_PORT_INTERNAL}"

    environment:

      TZ: Europe/Berlin

      SERVER_PORT: ${SERVER_PORT}


      # -----------------------------------------------------------------------
      # MariaDB
      # -----------------------------------------------------------------------

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}

      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}

      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}


      # -----------------------------------------------------------------------
      # JPA
      # -----------------------------------------------------------------------

      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}

      SPRING_JPA_GENERATE_DDL: ${SPRING_JPA_GENERATE_DDL}

      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}

      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE}


      # -----------------------------------------------------------------------
      # Keycloak / JWT
      # -----------------------------------------------------------------------

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}

      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID}


      # -----------------------------------------------------------------------
      # Mail
      # -----------------------------------------------------------------------

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}

      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}

      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}

      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH}

      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE}

    depends_on:
      backend-db:
        condition: service_healthy

      keycloak:
        condition: service_healthy

    networks:
      - foodcoops


  # ===========================================================================
  # Backend MariaDB
  # ===========================================================================

  backend-db:
    image: mariadb:11.8

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${BACKEND_DB_DATABASE}

      MARIADB_USER: ${BACKEND_DB_USER}

      MARIADB_PASSWORD: ${BACKEND_DB_PASSWORD}

      MARIADB_ROOT_PASSWORD: ${BACKEND_DB_ROOT_PASSWORD}

    volumes:
      - backend_db:/var/lib/mysql

    expose:
      - "${MARIADB_PORT_INTERNAL}"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - foodcoops


  # ===========================================================================
  # Keycloak
  # ===========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1

    restart: unless-stopped

    command:
      - start

    environment:

      # -----------------------------------------------------------------------
      # Database
      # -----------------------------------------------------------------------

      KC_DB: ${KC_DB}

      KC_DB_URL_HOST: ${KC_DB_URL_HOST}

      KC_DB_URL_PORT: ${KC_DB_URL_PORT}

      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}

      KC_DB_USERNAME: ${KC_DB_USERNAME}

      KC_DB_PASSWORD: ${KC_DB_PASSWORD}


      # -----------------------------------------------------------------------
      # HTTP behind nginx
      # -----------------------------------------------------------------------

      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}

      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}


      # -----------------------------------------------------------------------
      # Public URL
      # -----------------------------------------------------------------------

      KC_HOSTNAME: ${KC_HOSTNAME}

      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}


      # -----------------------------------------------------------------------
      # Reverse Proxy
      # -----------------------------------------------------------------------

      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}


      # -----------------------------------------------------------------------
      # Health
      # -----------------------------------------------------------------------

      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED}

      KC_HTTP_MANAGEMENT_RELATIVE_PATH: "/"


      # -----------------------------------------------------------------------
      # Initial Admin
      # -----------------------------------------------------------------------

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}

      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    depends_on:
      keycloak-db:
        condition: service_healthy

    expose:
      - "${KEYCLOAK_PORT_INTERNAL}"
      - "${KEYCLOAK_MANAGEMENT_PORT_INTERNAL}"

    healthcheck:
      test: >-
        bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
        grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"

      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - foodcoops


  # ===========================================================================
  # Keycloak MariaDB
  # ===========================================================================

  keycloak-db:
    image: mariadb:11.8

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${KEYCLOAK_DB_DATABASE}

      MARIADB_USER: ${KEYCLOAK_DB_USER}

      MARIADB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      MARIADB_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD}

    volumes:
      - keycloak_db:/var/lib/mysql

    expose:
      - "${MARIADB_PORT_INTERNAL}"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - foodcoops


# =============================================================================
# Network
# =============================================================================

networks:

  foodcoops:
    driver: bridge


# =============================================================================
# Volumes
# =============================================================================

volumes:

  nginx_cfg:

  certbot_conf:

  certbot_www:

  backend_db:

  keycloak_db: